signaling {
  cell-id=${?SIGNALING_CELL_ID}
  cluster-fingerprint=${?SIGNALING_CLUSTER_FINGERPRINT}
  user-hash-version=1
  ownership-hash-version=1
  postgres-lease {
    lease-class="io.webrtc.signaling.actors.lease.PostgresShardLease"
    heartbeat-interval=5s
    heartbeat-timeout=15s
    lease-operation-timeout=2s
  }
  actor-dispatcher {
    type=Dispatcher
    executor="thread-pool-executor"
    thread-pool-executor { fixed-pool-size=8, task-queue-size=8192, task-queue-type=linked }
    throughput=32
    throughput-deadline-time=5ms
  }
  lease-placement-mailbox { mailbox-type="org.apache.pekko.dispatch.NonBlockingBoundedMailbox", mailbox-capacity=2048, mailbox-push-timeout-time=0ms }
  control-mailbox {
    mailbox-type="org.apache.pekko.dispatch.NonBlockingBoundedMailbox"
    mailbox-capacity=128
    mailbox-push-timeout-time=0ms
  }
}
pekko {
  actor {
    provider=cluster
    allow-java-serialization=off
    warn-about-java-serializer-usage=on
    serialization-bindings { "io.webrtc.signaling.actors.cluster.CborSerializable"=jackson-cbor }
  }
  remote.artery {
    transport=tls-tcp
    canonical { hostname=${?SIGNALING_POD_IP}, port=25520 }
    bind.hostname="0.0.0.0"
    ssl.config {
      key-store=${?SIGNALING_REMOTING_KEYSTORE}
      trust-store=${?SIGNALING_REMOTING_TRUSTSTORE}
      key-store-password=${?SIGNALING_REMOTING_KEYSTORE_PASSWORD}
      key-password=${?SIGNALING_REMOTING_KEY_PASSWORD}
      trust-store-password=${?SIGNALING_REMOTING_TRUSTSTORE_PASSWORD}
      protocol="TLSv1.3"
      enabled-protocols=["TLSv1.3"]
      require-mutual-authentication=on
    }
    advanced {
      maximum-frame-size=256KiB
      maximum-large-frame-size=256KiB
      outbound-message-queue-size=256
      outbound-control-queue-size=256
      system-message-buffer-size=512
      outbound-large-message-queue-size=16
      inbound-lanes=2
      outbound-lanes=2
    }
  }
  cluster {
    roles=["signaling-actor"]
    min-nr-of-members=4
    down-removal-margin=10s
    failure-detector { heartbeat-interval=1s, acceptable-heartbeat-pause=3s, threshold=8 }
    role.signaling-actor.min-nr-of-members=4
    allow-weakly-up-members=off
    downing-provider-class="org.apache.pekko.cluster.sbr.SplitBrainResolverProvider"
    split-brain-resolver { stable-after=10s, down-all-when-unstable=on, active-strategy=keep-majority, keep-majority.role="signaling-actor" }
    configuration-compatibility-check {
      enforce-on-join=on
      checkers.signaling="io.webrtc.signaling.actors.cluster.FingerprintCompatibilityChecker"
    }
    sharding {
      number-of-shards=1024
      role="signaling-actor"
      state-store-mode=ddata
      remember-entities=off
      use-lease=""
      buffer-size=256
      handoff-timeout=10s
      shard-start-timeout=5s
      rebalance-interval=10s
      passivation.strategy=none
    }
  }
  discovery {
    method=kubernetes-api
    kubernetes-api {
      pod-namespace=${?SIGNALING_NAMESPACE}
      pod-label-selector=${?SIGNALING_DISCOVERY_SELECTOR}
      use-raw-ip=true
      container-name=""
    }
  }
  management {
    http { hostname=${?SIGNALING_POD_IP}, bind-hostname="0.0.0.0", port=8558, route-providers-read-only=true }
    cluster.bootstrap {
      new-cluster-enabled=off
      contact-point-discovery {
        service-name=${?SIGNALING_ACTOR_SERVICE}
        port-name="management"
        required-contact-point-nr=6
        discovery-method=pekko.discovery
      }
    }
  }
}
