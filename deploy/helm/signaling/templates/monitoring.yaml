{{- if .Values.monitoring.enabled }}
{{- if .Values.monitoring.dashboard }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-signaling-dashboard
  labels:
    grafana_dashboard: "1"
data:
  signaling-overview.json: |-
{{ .Files.Get "dashboards/signaling-overview.json" | indent 4 }}
{{- end }}
{{- if .Values.monitoring.rules }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}-signaling-rules
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
{{ .Files.Get "alerts/signaling-rules.yaml" | indent 2 }}
{{- end }}
{{- if .Values.monitoring.podMonitor }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ .Release.Name }}-signaling
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: webrtc-signaling
      app.kubernetes.io/instance: {{ .Release.Name }}
      cell: {{ .Values.cell }}
  podMetricsEndpoints:
    - port: health
      path: /metrics
      interval: 15s
      scrapeTimeout: 2s
{{- end }}
{{- end }}
