{{- range list "gateway" "actor" "control" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ . }}
spec:
  type: ClusterIP
  publishNotReadyAddresses: false
  selector:
    {{- include "signaling.labels" (dict "root" $ "component" .) | nindent 4 }}
  ports:
    - {name: business-tls, port: 8443, targetPort: business-tls}
    {{- if eq . "gateway" }}
    - {name: gateway-rpc, port: 9443, targetPort: gateway-rpc}
    {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $.Release.Name }}-{{ . }}
automountServiceAccountToken: {{ eq . "actor" }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: signaling-{{ .Values.cell }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "signaling.labels" (dict "root" . "component" "actor") | nindent 4 }}
  ports:
    - {name: artery-tls, port: 25520, targetPort: artery-tls}
    - {name: management, port: 8558, targetPort: management}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: signaling-{{ .Values.cell }}
rules:
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: signaling-{{ .Values.cell }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: signaling-{{ .Values.cell }}}
subjects:
  - {kind: ServiceAccount, name: {{ .Release.Name }}-actor, namespace: {{ .Release.Namespace }}}
